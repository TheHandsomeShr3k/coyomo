#coyomo-fresh{--cy-bg:light-dark(#f7f8fc,#101522);--cy-ink:light-dark(#172139,#f3f5ff);--cy-muted:light-dark(#58627b,#b3bdd2);--cy-surface:light-dark(#fff,#1a2234);--cy-line:light-dark(#dce1ee,#333e55);--cy-soft:light-dark(#e9edff,#202e59);--cy-blue:light-dark(#3449e9,#95a6ff);--cy-lime:#dfff8b;--cy-round:26px;font:500 16px/1.6 'Manrope',Arial,sans-serif;background:var(--cy-bg);color:var(--cy-ink);container-type:inline-size;isolation:isolate}
#coyomo-fresh *{box-sizing:border-box}
#coyomo-fresh [hidden]{display:none!important}
#coyomo-fresh h1,#coyomo-fresh h2,#coyomo-fresh h3,#coyomo-fresh p{margin:0;color:inherit;font-family:inherit}
#coyomo-fresh button,#coyomo-fresh input,#coyomo-fresh select{font:inherit}
#coyomo-fresh button{cursor:pointer;color:inherit}
#coyomo-fresh a{color:inherit}
#coyomo-fresh button:disabled{cursor:default}
#coyomo-fresh .cy-wrap{padding-inline:5.3%}
#coyomo-fresh .cy-top{display:flex;justify-content:space-between;gap:14px;font-size:12px;letter-spacing:.035em;padding-block:9px;border-bottom:1px solid var(--cy-line);color:var(--cy-muted)}
#coyomo-fresh .cy-top span:first-child{display:flex;gap:8px;align-items:center}
#coyomo-fresh .cy-top svg{width:14px;height:14px}
#coyomo-fresh .cy-nav{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-block:24px}
#coyomo-fresh .cy-brand{background:none;border:0;padding:0;font-weight:800;letter-spacing:-.075em;font-size:38px;line-height:1}
#coyomo-fresh .cy-navlinks{display:flex;gap:23px;align-items:center}
#coyomo-fresh .cy-navlinks a{background:none;border:0;padding:10px 0;font-size:14px;font-weight:700}
#coyomo-fresh .cy-navlinks a[aria-current=page]{color:var(--cy-blue);text-decoration:underline;text-underline-offset:7px}
#coyomo-fresh .cy-button{background:var(--cy-ink);color:var(--cy-bg);border:1px solid transparent;min-height:52px;padding:13px 21px;border-radius:14px;display:inline-flex;justify-content:center;align-items:center;gap:14px;font-size:15px;font-weight:800;line-height:1.5;text-decoration:none}
#coyomo-fresh .cy-button:hover{filter:brightness(.92)}
#coyomo-fresh .cy-button svg{width:19px;height:19px}
#coyomo-fresh .cy-button.cy-lime{background:var(--cy-lime);color:#172139}
#coyomo-fresh .cy-button.cy-outline{background:transparent;color:var(--cy-ink);border-color:var(--cy-line)}
#coyomo-fresh .cy-button.cy-white{background:#fff;color:#172139}
#coyomo-fresh .cy-textbutton{padding:9px 0;background:none;border:0;font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:5px;text-align:left}
#coyomo-fresh .cy-eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
#coyomo-fresh .cy-muted{color:var(--cy-muted)}
#coyomo-fresh .cy-small{font-size:13px;line-height:1.6;color:var(--cy-muted)}
#coyomo-fresh .cy-hero{margin:8px 2% 0;background:var(--cy-soft);border-radius:32px;display:grid;grid-template-columns:1.12fr 1fr;gap:0;align-items:center;min-height:630px;padding:44px 4%;position:relative}
#coyomo-fresh .cy-hero-copy{position:relative;z-index:2}
#coyomo-fresh .cy-hero h1{font-size:clamp(52px,7.7vw,89px);font-weight:800;line-height:1.02;letter-spacing:-.071em;margin:24px 0}
#coyomo-fresh .cy-hero h1 em{font-style:normal;color:var(--cy-blue)}
#coyomo-fresh .cy-hero-copy>p{font-size:17px;color:var(--cy-muted);max-width:33ch}

  function capacity(){
    const estimate=calc(),tiers=[30,50,100,200,300,500,1000];
    let base=30,comfort=50;
    if(state.mode==='known'){
      if(state.months.every(v=>v===''))return {base:null,comfort:null,selected:null,estimate};
      base=tiers.find(n=>n>=estimate.hi)||'Unlimited';
      comfort=base==='Unlimited'?'Unlimited':(tiers[tiers.indexOf(base)+1]||'Unlimited');
    }else{
      if(state.enabled.music)base=50;
      if(state.enabled.video||state.enabled.hotspot)base=100;
      const needed=tiers.find(n=>n>=estimate.hi)||'Unlimited';
      if(needed==='Unlimited'||needed>base)base=needed;
      comfort=state.enabled.hotspot||base==='Unlimited'?'Unlimited':(tiers[tiers.indexOf(base)+1]||'Unlimited');
    }
    return {base,comfort,selected:state.capacityChoice==='comfort'?comfort:base,estimate};
  }

    root.scrollIntoView({block:'start',behavior:'auto'});
    announce(view);
  }

    const heading=main.querySelector('h1');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true});}
  }

    const bd=root.querySelector('#cy-breakdown');if(bd)bd.innerHTML=breakdown();
    refreshRecommendation();
  }

    const sub=root.querySelector('#cy-house-sub');if(sub)sub.textContent=d.people+' '+(d.people===1?'Person':'Personen')+' gleichzeitig online';

  }

    const link=e.target.closest('#cy-mail-link');

    const b=e.target.closest('button');if(!b)return;
    let handled=true;
    if(b.dataset.home){
      const d=state.internet;d.home=b.dataset.home;d.area=({small:50,medium:80,large:130,house:180})[d.home];d.turn=0;root.querySelector('#cy-house-model').style.transform='';state.prepared.internet=true;
      root.querySelector('#cy-area').value=d.area;root.querySelector('#cy-area-value').textContent=d.area+' m²';
      root.querySelectorAll('[data-home]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.home===d.home)));internetUpdate();
    }else if(b.dataset.risk){
      state.protection.risk=b.dataset.risk;state.protection.priority=riskData().priority;state.prepared.protection=true;
      root.querySelectorAll('[data-risk]').forEach(x=>{if(x.tagName==='BUTTON')x.setAttribute('aria-pressed',String(x.dataset.risk===b.dataset.risk));});
      root.querySelector('#cy-protect-art').dataset.risk=b.dataset.risk;
      root.querySelector('#cy-risk-copy').innerHTML='<h2>'+riskData().title+'</h2><p>'+riskData().text+'</p>';
      root.querySelector('#cy-risk-marker').innerHTML=icon(riskData().icon);
      root.querySelector('[data-group="protection"][data-field="priority"]').value=state.protection.priority;enhance();
    }else if(b.dataset.action==='internet-recommend')revealInternet();
    else if(b.dataset.action==='internet-back'){
      state.internet.result=false;state.internet.turn=0;
      root.querySelector('#cy-internet-scene').classList.remove('cy-house-result');root.querySelector('#cy-internet-result').hidden=true;
      const controls=root.querySelector('.cy-home-controls');controls.inert=false;controls.removeAttribute('aria-hidden');
      root.querySelector('#cy-house-model').style.transform='';controls.querySelector('[data-action="internet-recommend"]').focus({preventScroll:true});
    }else if(b.dataset.action==='rotate-house'){
      state.internet.turn+=90;root.querySelector('#cy-house-model').style.transform='rotateX(56deg) rotateZ('+((state.internet.result?328:-32)+state.internet.turn)+'deg) scale(calc(var(--house-scale,1) * var(--house-viewport-scale,1)))';
    }else if(b.dataset.action==='protection-details'){
      root.querySelector('#cy-protect-details').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
      root.querySelector('[data-group="protection"][data-field="model"]').focus({preventScroll:true});
    }else if(b.dataset.action==='copy-request'){
      const status=root.querySelector('#cy-mail-status');
      const fallback=()=>{const field=root.querySelector('#cy-mail-text');field.closest('details').open=true;field.focus();field.select();status.textContent='Der Anfragetext ist markiert. Kopiere ihn und sende ihn an info@coyomo.de.';};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(mailBody()).then(()=>{status.textContent='Anfragetext kopiert. Füge ihn in deine E-Mail an info@coyomo.de ein.';}).catch(fallback);else fallback();
    }else handled=false;
    if(handled)e.stopImmediatePropagation();
  });
  root.addEventListener('input',function(e){
    const t=e.target;
    if(t.id==='cy-area'){
      const d=state.internet;d.area=Number(t.value);if(d.home!=='house')d.home=d.area<=60?'small':d.area<=100?'medium':'large';
      root.querySelector('#cy-area-value').textContent=t.value+' m²';root.querySelectorAll('[data-home]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.home===d.home)));state.prepared.internet=true;internetUpdate();
    }
    if(t.dataset.group==='appointment')state.appointment.submitted=false;
    if(t.dataset.field==='contact'&&t.dataset.group==='appointment')t.setCustomValidity('');
    if(t.dataset.field==='name'&&t.dataset.group==='appointment')t.setCustomValidity('');
  });

  root.addEventListener('click',function(e){
    const link=e.target.closest('a[data-view]');
    if(link){if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();go(link.dataset.view);return;}
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.toggle){
      const wasKnown=state.mode==='known';
      const k=b.dataset.toggle;state.enabled[k]=!state.enabled[k];state.mode='estimate';state.capacityChoice='base';state.prepared.usage=true;
      if(wasKnown)rebuildRecommendationControls();
      b.setAttribute('aria-pressed',String(state.enabled[k]));
      root.querySelector('#cy-phone-label').textContent='Dein passendes Datenpaket';
      root.querySelector('#cy-phone-value').textContent=planLabel();
      root.querySelector('#cy-phone-extra').textContent='pro Monat · großzügig geplant';
      const slider=root.querySelector('[data-minutes="'+k+'"]');if(slider)slider.disabled=!state.enabled[k];
      const check=root.querySelector('[data-activity="'+k+'"]');if(check)check.checked=state.enabled[k];
      if(state.heroResult)refreshRecommendation();return;
    }
    if(b.dataset.capacity){state.capacityChoice=b.dataset.capacity;refreshRecommendation();const active=root.querySelector('[data-capacity="'+state.capacityChoice+'"]');if(active)active.focus({preventScroll:true});return;}
    if(b.dataset.mode){state.mode=b.dataset.mode;render();const m=root.querySelector('[data-mode="'+state.mode+'"]');if(m)m.focus({preventScroll:true});return;}
    if(b.dataset.internetActivity){state.internet.activity=b.dataset.internetActivity;state.prepared.internet=true;root.querySelectorAll('[data-internet-activity]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});internetUpdate();return;}
    const a=b.dataset.action;
    if(a==='recommend'){revealRecommendation();return;}
    if(a==='recommend-contract'){state.prepared.usage=true;go('contract');return;}
    if(a==='back-to-phone'){
      state.heroResult=false;state.flipped=false;
      const scene=root.querySelector('#cy-scene'),intro=root.querySelector('.cy-intro'),device=root.querySelector('.cy-device');
      scene.classList.remove('cy-show-result');root.querySelector('#cy-recommendation').hidden=true;
      device.classList.remove('cy-turning','cy-flipped');intro.inert=false;intro.removeAttribute('aria-hidden');
      root.querySelector('.cy-phone-next').textContent='Empfehlung ansehen →';
      syncPhoneAccessibility();artRender();root.querySelector('.cy-turn').setAttribute('aria-label','Smartphone drehen');const next=intro.querySelector('[data-action="recommend"]');if(next){next.focus({preventScroll:true});if(document.activeElement!==next)setTimeout(function(){next.focus({preventScroll:true});},300);}return;
    }
    if(a==='flip'){
      state.flipped=!state.flipped;const d=root.querySelector('.cy-device');d.classList.remove('cy-turning');d.style.transform='';d.classList.toggle('cy-flipped',state.flipped);
      root.querySelector('.cy-device-front').inert=state.flipped;b.setAttribute('aria-label',state.flipped?'Vorderseite zeigen':'Smartphone drehen');artRender();return;
    }

      state.context=a.slice(5);state.prepared[state.context]=true;state.appointment.topic=state.context==='internet'?'Internet zuhause':state.context==='protection'?'Handyschutz':'Mobilfunk & Vertragscheck';
      if(state.context==='contract'&&state.contract.type==='Internet zuhause')state.appointment.topic='Internet zuhause';
      go('appointment');
    }
  });
  root.addEventListener('input',function(e){
    const t=e.target;
    if(t.hasAttribute('data-age')){state.age=t.value===''?'':String(Math.min(120,Math.max(0,Math.floor(Number(t.value)||0))));state.prepared.usage=true;refreshRecommendation();}

    if(state.prepared[state.view]!==undefined)state.prepared[state.view]=true;

  }
